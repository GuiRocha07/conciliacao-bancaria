<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Concilia{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('inicio') }}">🏦 Concilia</a>
    <nav>
      <a href="{{ url_for('inicio') }}">Nova conciliação</a>
      <a href="{{ url_for('ver_historico') }}">Histórico</a>
    </nav>
  </header>
  <main>
    {% for m in get_flashed_messages() %}<p class="aviso">{{ m }}</p>{% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
